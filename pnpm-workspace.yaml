packages:
  - apps/*
  - packages/*

# Single source of truth for versions shared across workspace packages.
catalog:
  '@types/node': ^22.20.5
  '@vitest/coverage-v8': ^4.1.11
  oxlint: ^1.87.0
  prettier: ^3.9.10
  typescript: ~6.0.3
  vitest: ^4.1.11
  zod: 4.6.5

# Dependencies allowed to run install scripts (supply-chain hardening).
allowBuilds:
  better-sqlite3: true
