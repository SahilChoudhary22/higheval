# Optional: publish HighEval on the internet through Tailscale Funnel, as its
# own tailnet node (https://<TS_HOSTNAME>.<tailnet>.ts.net), without a domain:
#
#   docker compose -f compose.yaml -f compose.tailscale.yaml up -d
#
# Needs TS_AUTHKEY (a Tailscale auth key) in .env, Funnel allowed for the node
# by the tailnet policy, and that hostname in ALLOWED_HOSTS.
services:
  tailscale:
    image: tailscale/tailscale:v1.102.2
    restart: unless-stopped
    environment:
      # Passed one by one, so the Tailscale container never sees the app's other secrets.
      TS_AUTHKEY: ${TS_AUTHKEY:?Set TS_AUTHKEY in .env}
      TS_HOSTNAME: ${TS_HOSTNAME:-higheval}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      # Userspace networking: no TUN device or extra capabilities needed.
      TS_USERSPACE: 'true'
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./deploy/tailscale-serve.json:/config/serve.json:ro
    depends_on:
      - higheval

volumes:
  tailscale-state:
